<main>
    <div id="dashboard">
        <app-dashboard-item title="Server Status" imageName="status.png">
            <app-server-status [currentStatus]="currentStatus" />
        </app-dashboard-item>
        <app-dashboard-item title="Traffic" imageName="list.png">
            <app-traffic [dummyTrafficData]="dummyTrafficData" [maxTraffic]="maxTraffic" />
        </app-dashboard-item>
        <app-dashboard-item title="Support Tickets" imageName="globe.png" alt="A globe">
            <app-tickets />
        </app-dashboard-item>
    </div>
</main>
