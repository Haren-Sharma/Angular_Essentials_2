<form (ngSubmit)="onSubmit(enteredTitle.value,enteredRequest.value)" #form>
    <app-control title="Title">
        <input type="text" name="title" id="title" #enteredTitle #input>
    </app-control>
    <app-control title="Request">
        <textarea name="request" id="request" rows="5" #enteredRequest #input></textarea>
    </app-control>
    <button app-button>
        Submit
        <span ngProjectAs="icon">
            →
        </span>
    </button>
</form>
